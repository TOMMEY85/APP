<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CARPZONE - Application professionnelle de pêche à la carpe">
  <title>CARPZONE - Analyse. Prépare. Capture.</title>
  <meta name="theme-color" content="#080808">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CARPZONE">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-180.png">
  
  <!-- Font Awesome pour les icônes -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Styles de l'application -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/phone-frame.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div class="phone-frame">
    <div class="notch"></div>
    <div class="app-container">
      
      <div class="screen-content">
        <!-- HOME SCREEN -->
        <div class="screen active" id="home">
          <div class="home-screen"></div>
        </div>

        <!-- MAP SCREEN -->
        <div class="screen" id="map">
          <div class="map-screen"></div>
        </div>

        <!-- SESSIONS SCREEN -->
        <div class="screen" id="sessions">
          <div class="sessions-screen"></div>
        </div>

        <!-- CATCHES SCREEN -->
        <div class="screen" id="catches">
          <div class="catches-screen"></div>
        </div>

        <!-- PROFILE SCREEN -->
        <div class="screen" id="profile">
          <div class="profile-screen"></div>
        </div>
      </div>

      <!-- NAVIGATION BAR -->
      <div class="nav-bar">
        <div class="nav-item active" data-screen="home">
          <i class="fas fa-home"></i>
          <div class="nav-label">Accueil</div>
        </div>
        <div class="nav-item" data-screen="map">
          <i class="fas fa-map"></i>
          <div class="nav-label">Carte</div>
        </div>
        <div class="nav-plus" id="nav-add-btn">+</div>
        <div class="nav-item" data-screen="sessions">
          <i class="fas fa-list"></i>
          <div class="nav-label">Sessions</div>
        </div>
        <div class="nav-item" data-screen="catches">
          <i class="fas fa-fish"></i>
          <div class="nav-label">Prises</div>
        </div>
        <div class="nav-item" data-screen="profile">
          <i class="fas fa-user"></i>
          <div class="nav-label">Profil</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="data/app-data.js"></script>
  <script src="js/ui-generator.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Service Worker:', err));
      });
    }
  </script>
</body>
</html>
