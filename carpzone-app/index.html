  <script>
    // CARPZONE v7 : purge unique des anciens caches pour sortir des versions mélangées.
    window.addEventListener('load', async () => {
      try {
        if (localStorage.getItem('carpzone_cache_reset_v7') !== 'done') {
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k)));
          }
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(r => r.unregister()));
          }
          localStorage.setItem('carpzone_cache_reset_v7', 'done');
          location.replace(location.pathname + '?v7-20260907');
          return;
        }

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('./sw.js?v7-20260907').catch(err => console.warn('Service Worker:', err));
        }
      } catch (err) {
        console.warn('Nettoyage cache:', err);
      }
    });
  </script>
