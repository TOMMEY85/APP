<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond noir -->
  <rect width="512" height="512" fill="#080808"/>
  
  <!-- Cercle de contour rouge -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#D00000" stroke-width="8"/>
  
  <!-- Texte CARPZONE -->
  <g>
    <!-- Lettre C principale -->
    <text x="256" y="340" font-family="Arial, sans-serif" font-size="180" font-weight="bold" fill="#D00000" text-anchor="middle">C</text>
    
    <!-- Crochet de pêche intégré (optionnel) -->
    <g transform="translate(320, 180)">
      <path d="M 0 0 Q 20 10 20 30 Q 20 50 0 50" stroke="#D00000" stroke-width="6" fill="none" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="4" fill="#D00000"/>
    </g>
  </g>
  
  <!-- Texte ZONE en plus petit -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#999" text-anchor="middle">ZONE</text>
</svg>
