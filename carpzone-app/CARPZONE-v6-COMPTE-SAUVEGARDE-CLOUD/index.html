<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="CARPZONE - Application professionnelle de pêche à la carpe. Gérez vos sessions, prises, spots et appâts.">
  <title>CARPZONE - Analyse. Prépare. Capture.</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.webmanifest">
  
  <!-- Thème et couleurs -->
  <meta name="theme-color" content="#D00000">
  <meta name="background-color" content="#080808">
  
  <!-- Apple/iOS Support -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CARPZONE">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-180.png">
  
  <!-- Android Support -->
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png">
  
  <!-- Maskable Icon pour Android 12+ -->
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-maskable-512.png" media="(prefers-color-scheme: dark)">
  
  <!-- Splash Screen iOS (iPad) -->
  <link rel="apple-touch-startup-image" href="assets/icons/icon-512.png">
  
  <!-- Font Awesome pour les icônes -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Leaflet CSS pour la carte interactive -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  
  <!-- Styles de l'application -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/phone-frame.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  
  <style>
    #map-container {
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      border-radius: 12px;
      position: relative;
    }
    
    .leaflet-container {
      background: #0a0a0a;
      color: #fff;
    }
    
    .leaflet-control-container {
      font-family: Arial, sans-serif;
    }
    
    .leaflet-tile-pane {
      filter: invert(0.9) hue-rotate(180deg) saturate(0.8);
    }
    
    .leaflet-popup-content-wrapper {
      background-color: #1a1a1a;
      border-radius: 8px;
    }
    
    .leaflet-popup-content {
      color: #fff;
    }
    
    .custom-marker {
      filter: drop-shadow(0 0 4px rgba(208, 0, 0, 0.5));
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="notch"></div>
    <div class="app-container">
      
      <div class="screen-content">
        <!-- HOME SCREEN -->
        <div class="screen active" id="home">
          <div class="home-screen"></div>
        </div>

        <!-- MAP SCREEN -->
        <div class="screen" id="map">
          <div class="map-screen"></div>
        </div>

        <!-- SESSIONS SCREEN -->
        <div class="screen" id="sessions">
          <div class="sessions-screen"></div>
        </div>

        <!-- CATCHES SCREEN -->
        <div class="screen" id="catches">
          <div class="catches-screen"></div>
        </div>

        <!-- PROFILE SCREEN -->
        <div class="screen" id="profile">
          <div class="profile-screen"></div>
        </div>
      </div>

      <!-- NAVIGATION BAR -->
      <div class="nav-bar">
        <div class="nav-item active" data-screen="home">
          <i class="fas fa-home"></i>
          <div class="nav-label">Accueil</div>
        </div>
        <div class="nav-item" data-screen="map">
          <i class="fas fa-map"></i>
          <div class="nav-label">Carte</div>
        </div>
        <div class="nav-plus" id="nav-add-btn">+</div>
        <div class="nav-item" data-screen="sessions">
          <i class="fas fa-list"></i>
          <div class="nav-label">Sessions</div>
        </div>
        <div class="nav-item" data-screen="catches">
          <i class="fas fa-fish"></i>
          <div class="nav-label">Prises</div>
        </div>
        <div class="nav-item" data-screen="profile">
          <i class="fas fa-user"></i>
          <div class="nav-label">Profil</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="data/app-data.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/profile-manager.js"></script>
  
  <!-- Leaflet JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="js/map-manager.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth-cloud.js"></script>
  <script src="js/ui-generator.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Service Worker:', err));
      });
    }
  </script>
</body>
</html>
